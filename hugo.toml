baseURL = "https://cgarrote.cc/"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
locale = "en"
title = "Carlos Garrote"
theme = "gokarna"
# Choose one of emacs, trac or perldoc
# pygmentsStyle = "monokai"

[params]
	# Choose the color shown when hyperlinks are hovered over
	# accentColor = "#ECF00C"
	accentColor = "#ADADB0"

	fontSize = "1.1rem" # equal to 17.6px
	# fontSize = "0.7rem"

	# Resource URL for the site avatar (home page and header)
	avatarURL = "https://avatars.githubusercontent.com/u/129984114?v=4"

	# Describe the avatar for screen readers
	avatarAltText = "avatar"

	# Set the avatar's size: s2020-01-25ize-xs, size-s, size-m, size-l & size-xl
	avatarSize = "size-xl"

	# Inject arbitrary HTML via the <head> tag
	# Best used for importing custom JavaScript, CSS, or analytics
	# customHeadHTML = "<link rel='icon' type='image/jpeg' href='https://avatars.githubusercontent.com/u/129984114?v=4'>"
	customHeadHTML = "<link rel='icon' type='image/jpeg' href='https://avatars.githubusercontent.com/u/129984114?v=4'>"

	# Configure how post dates are displayed
	dateFormat = "2020-01-25"

	# Home page meta description
	description = "Emerging Cloud & Infrastructure Engineer | Musician"

	# Footer text (i.e. author/project name)
	footer = "Carlos Garrote"

	# Define SEO keywords
	metaKeywords = ["blog", "cgarrote", "garrotini", "devops",  "hugo"]

	# Define how many posts are displayed on the home page
	# showPostsOnHomePage must be "popular" or "recent"
	numberPostsOnHomePage = 4

	# Display a "back to top" button on posts and pages: true, false
	# May not render on smaller screen sizes
	showBackToTopButton = true

	# Display posts on the home page:
	# "popular" (order posts by weight)
	# "recent" (order posts by date)
	# "", unset (do not display)
	showPostsOnHomePage = ""

	# Show the previous and next post in your timeline: "true", "false"
	# Incompatible with Weight
	togglePreviousAndNextButtons = false
  socialIcons = [
    {name = "github", url = "https://github.com/garrotini"},
    {name = "linkedin", url = "https://linkedin.com/in/garrotini"},
    {name = "instagram", url = "https://instagram.com/cgarrotebass"},
    {name = "email", url = "mailto:cgarrote92@gmail.com"}
  ]

[menu]
  [[menu.main]]
    name = "About"
    pre = "<span data-feather='user'></span>"
    url = "/about/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    pre = "<span data-feather='book'></span>"
    url = "/posts/"
    weight = 3

  [[menu.main]]
    name = "Projects"
    pre = "<span data-feather='code'></span>"
    url = "/projects/"
    weight = 2

  [[menu.main]]
    name = "Tags"
    pre = "<span data-feather='tag'></span>"
    url = "/tags/"
    weight = 4

	[[menu.main]]
		# Unique identifiers are required for menu entries without a name property,
		# or for menu entries which re-use a name
		identifier = "github"

		# Absolute URL to external resource
		url = "https://github.com/garrotini"
		weight = 5
		
		# Surround the menu entry (or name) with HTML content, such as Feather
		# icons: https://feathericons.com
		pre = "<span data-feather='github'></span>"
		post = ""

	[[menu.main]]
		# Unique identifiers are required for menu entries without a name property,
		# or for menu entries which re-use a name
		identifier = "linkedin"

		# Absolute URL to external resource
		url = "https://linkedin.com/in/garrotini"
		weight = 5
		
		# Surround the menu entry (or name) with HTML content, such as Feather
		# icons: https://feathericons.com
		pre = "<span data-feather='linkedin'></span>"
		post = ""


[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false

[minify]
    minifyOutput = true

